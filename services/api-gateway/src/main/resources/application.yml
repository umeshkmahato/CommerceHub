server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        # Distributed rate limit on EVERY route: 100 req/min per client IP.
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@ipKeyResolver}"
            redis-rate-limiter.replenishRate: 100
            redis-rate-limiter.burstCapacity: 100
            redis-rate-limiter.requestedTokens: 1
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "http://localhost:*,http://127.0.0.1:*"
            allowedMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # ---- user-service: auth is public, profile needs JWT ----
        - id: user-auth
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: user-profile
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**
        # ---- product-service: browse public, admin needs JWT+ADMIN ----
        - id: product-browse
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/products/**,/api/v1/categories/**
        - id: product-admin
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/admin/products/**
        # ---- cart ----
        - id: cart
          uri: ${CART_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/cart/**
        # ---- orders ----
        - id: orders
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/orders/**
        # ---- payments ----
        - id: payments
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/payments/**
        # ---- inventory (internal/admin) ----
        - id: inventory
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/inventory/**

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
