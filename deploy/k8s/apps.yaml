# ShopSphere app deployments — one Deployment+Service per component.
# Probes use Spring Boot actuator health groups (liveness/readiness enabled
# in every service's application.yml). Resources sized for a demo cluster.
apiVersion: apps/v1
kind: Deployment
metadata: {name: api-gateway, namespace: shopsphere}
spec:
  replicas: 2
  selector: {matchLabels: {app: api-gateway}}
  template:
    metadata: {labels: {app: api-gateway}}
    spec:
      containers:
      - name: gateway
        image: shopsphere/api-gateway:1.0.0
        ports: [{containerPort: 8080}]
        envFrom:
        - configMapRef: {name: shopsphere-config}
        - secretRef: {name: shopsphere-secrets}
        env:
        - {name: USER_SERVICE_URL, value: "http://user-service"}
        - {name: PRODUCT_SERVICE_URL, value: "http://product-service"}
        - {name: CART_SERVICE_URL, value: "http://cart-service"}
        - {name: ORDER_SERVICE_URL, value: "http://order-service"}
        - {name: PAYMENT_SERVICE_URL, value: "http://payment-service"}
        - {name: INVENTORY_SERVICE_URL, value: "http://inventory-service"}
        resources:
          requests: {cpu: 100m, memory: 512Mi}
          limits: {cpu: "1", memory: 1Gi}
        readinessProbe:
          httpGet: {path: /actuator/health/readiness, port: 8080}
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /actuator/health/liveness, port: 8080}
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata: {name: api-gateway, namespace: shopsphere}
spec:
  selector: {app: api-gateway}
  ports: [{port: 80, targetPort: 8080}]
---
# ---- template reused for domain services (see docs/kubernetes.md for the
#      generated per-service variants: user, product, cart, order, payment,
#      inventory, notification) ----
apiVersion: apps/v1
kind: Deployment
metadata: {name: user-service, namespace: shopsphere}
spec:
  replicas: 2
  selector: {matchLabels: {app: user-service}}
  template:
    metadata: {labels: {app: user-service}}
    spec:
      containers:
      - name: app
        image: shopsphere/user-service:1.0.0
        ports: [{containerPort: 8081}]
        envFrom:
        - configMapRef: {name: shopsphere-config}
        - secretRef: {name: shopsphere-secrets}
        env:
        - {name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/userdb"}
        - {name: SPRING_DATASOURCE_USERNAME, value: "user_svc"}
        - {name: SPRING_DATASOURCE_PASSWORD, value: "user_pw"}
        resources:
          requests: {cpu: 100m, memory: 512Mi}
          limits: {cpu: "1", memory: 1Gi}
        readinessProbe:
          httpGet: {path: /actuator/health/readiness, port: 8081}
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /actuator/health/liveness, port: 8081}
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata: {name: user-service, namespace: shopsphere}
spec:
  selector: {app: user-service}
  ports: [{port: 8081}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: product-service, namespace: shopsphere}
spec:
