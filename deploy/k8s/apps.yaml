        env:
        - {name: SPRING_DATASOURCE_URL, value: "jdbc:mysql://mysql:3306/productdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"}
        - {name: SPRING_DATASOURCE_USERNAME, value: "product"}
        - {name: SPRING_DATASOURCE_PASSWORD, value: "product_pw"}
        resources:
          requests: {cpu: 100m, memory: 512Mi}
          limits: {cpu: "1", memory: 1Gi}
        readinessProbe:
          httpGet: {path: /actuator/health/readiness, port: 8082}
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /actuator/health/liveness, port: 8082}
          initialDelaySeconds: 30
          periodSeconds: 20
---
