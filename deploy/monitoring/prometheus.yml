global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Each Spring Boot service exposes /actuator/prometheus (micrometer-registry-prometheus
  # is pulled in by spring-boot-starter-actuator when configured).
  - job_name: shopsphere-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - user-service:8081
          - product-service:8082
          - cart-service:8083
          - order-service:8084
          - payment-service:8085
          - inventory-service:8086
          - notification-service:8087
    # In Docker Compose use service names; in K8s use pod annotations +
    # prometheus-operator servicemonitors instead.
