# ShopSphere — full local stack.
#   docker compose up --build
# Web: http://localhost  Gateway API: http://localhost:8080
#
# Databases use per-service users (least privilege). Secrets are dev-only
# defaults — override via .env for anything real.

name: shopsphere

x-java-env: &java-env
  SPRING_PROFILES_ACTIVE: docker

services:
  # ---------------- infrastructure ----------------
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/db/mysql-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./deploy/db/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 15

  # Creates all domain topics once Kafka is healthy (auto.create would
  # also work; explicit topics = documented partitions/retention).
  kafka-init:
    image: confluentinc/cp-kafka:7.7.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in order-created order-confirmed order-cancelled order-failed \
                 inventory-reserved inventory-failed payment-initiated \
                 payment-completed payment-failed payment-refunded \
                 notification-events product-events; do
          kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic $$t --partitions 3 --replication-factor 1
        done
        # DLQs are created lazily by producers; pre-create for clarity.
        for t in order-created.DLT order-cancelled.DLT inventory-reserved.DLT \
                 payment-completed.DLT payment-failed.DLT; do
          kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic $$t --partitions 1 --replication-factor 1
        done

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------- backend services ----------------
  user-service:
    build: { context: ., dockerfile: services/user-service/Dockerfile }
    environment:
      <<: *java-env
      POSTGRES_HOST: postgres
      POSTGRES_USER: user_svc
      POSTGRES_PASSWORD: user_pw
      POSTGRES_DB: userdb
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-32bytes-min!!}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/userdb
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }

  product-service:
    build: { context: ., dockerfile: services/product-service/Dockerfile }
    environment:
      <<: *java-env
      MYSQL_HOST: mysql
      MYSQL_USER: product
      MYSQL_PASSWORD: product_pw
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/productdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["8082:8082"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  cart-service:
    build: { context: ., dockerfile: services/cart-service/Dockerfile }
    environment:
      <<: *java-env
      MYSQL_HOST: mysql
      MYSQL_USER: cart
      MYSQL_PASSWORD: cart_pw
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cartdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      PRODUCT_SERVICE_URL: http://product-service:8082
    ports: ["8083:8083"]
    depends_on:
      mysql: { condition: service_healthy }
      product-service: { condition: service_started }

  order-service:
    build: { context: ., dockerfile: services/order-service/Dockerfile }
    environment:
      <<: *java-env
      POSTGRES_HOST: postgres
      POSTGRES_USER: order_svc
      POSTGRES_PASSWORD: order_pw
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderdb
      CART_SERVICE_URL: http://cart-service:8083
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["8084:8084"]
    depends_on:
      postgres: { condition: service_healthy }
      cart-service: { condition: service_started }
      kafka: { condition: service_healthy }

  payment-service:
    build: { context: ., dockerfile: services/payment-service/Dockerfile }
    environment:
      <<: *java-env
      POSTGRES_HOST: postgres
      POSTGRES_USER: payment_svc
      POSTGRES_PASSWORD: payment_pw
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/paymentdb
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYMENT_FAILURE_RATE: ${PAYMENT_FAILURE_RATE:-0.0}
    ports: ["8085:8085"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  inventory-service:
    build: { context: ., dockerfile: services/inventory-service/Dockerfile }
    environment:
      <<: *java-env
      MYSQL_HOST: mysql
      MYSQL_USER: inventory
      MYSQL_PASSWORD: inventory_pw
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/inventorydb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["8086:8086"]
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }

  notification-service:
    build: { context: ., dockerfile: services/notification-service/Dockerfile }
    environment:
      <<: *java-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
    ports: ["8087:8087"]
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }

  api-gateway:
    build: { context: ., dockerfile: services/api-gateway/Dockerfile }
    environment:
      <<: *java-env
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-32bytes-min!!}
      REDIS_HOST: redis
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      CART_SERVICE_URL: http://cart-service:8083
      ORDER_SERVICE_URL: http://order-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      INVENTORY_SERVICE_URL: http://inventory-service:8086
    ports: ["8080:8080"]
    depends_on:
      user-service: { condition: service_started }
      product-service: { condition: service_started }
      cart-service: { condition: service_started }
      order-service: { condition: service_started }
      payment-service: { condition: service_started }
      inventory-service: { condition: service_started }
      redis: { condition: service_healthy }

  # ---------------- frontend ----------------
  web:
    build: { context: ./web, dockerfile: Dockerfile }
    ports: ["80:80"]
    depends_on:
      api-gateway: { condition: service_started }

volumes:
  mysql-data:
  pg-data:
